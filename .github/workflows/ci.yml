name: AlgorithmCompiler CI/CD & Robustesse

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            cxx: g++
            artifact_name: algo-linux-x86_64
            bin_ext: ""
          - name: macOS x86_64
            os: macos-latest
            cxx: clang++
            artifact_name: algo-macos-x86_64
            bin_ext: ""
          - name: Windows x86_64
            os: windows-latest
            cxx: g++
            artifact_name: algo-windows-x86_64
            bin_ext: ".exe"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Transpiler validation)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies (NumPy)
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      # --- Configuration spécifique Linux ---
      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make

      # --- Configuration spécifique Windows (MSYS2 UCRT64) ---
      - name: Setup MSYS2 & MinGW Toolchain (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          path-type: inherit
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make

      # --- Compilation Unix (Linux & macOS) ---
      - name: Build project (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: |
          make CXX=${{ matrix.cxx }} CXXFLAGS="-std=c++20 -O2 -Wall -Wextra -Iinclude" all

      # --- Compilation Windows ---
      - name: Build project (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          if ! command -v make &> /dev/null; then
            cp /ucrt64/bin/mingw32-make.exe /ucrt64/bin/make.exe
          fi
          make TARGET_OS=windows CXXFLAGS="-std=c++20 -O2 -Wall -Wextra -Iinclude" all

      # --- Tests Unitaires (223 tests) ---
      - name: Run Unit Tests (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: |
          ./run_tests

      - name: Run Unit Tests (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          ./run_tests.exe

      # --- Fuzzing Automatisé (1 000 itérations) ---
      - name: Run Fuzzing Harness (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: |
          ./fuzz_runner 1000

      - name: Run Fuzzing Harness (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          ./fuzz_runner.exe 1000

      # --- Benchmarks de performance VM ---
      - name: Run VM Benchmarks (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: |
          make bench

      - name: Run VM Benchmarks (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          ./algo.exe benchmarks/01_heavy_loop.alg --vm --bench
          ./algo.exe benchmarks/02_fibonacci_deep.alg --vm --bench
          ./algo.exe benchmarks/03_tri_selection.alg --vm --bench
          ./algo.exe benchmarks/05_crible_premiers.alg --vm --bench

      # --- Validation du transpilateur Python ---
      - name: Validate Python Transpiler
        run: |
          node scripts/test_transpiler.js

      # --- Sauvegarde des artefacts de build ---
      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            algo${{ matrix.bin_ext }}
            algo_stub${{ matrix.bin_ext }}
